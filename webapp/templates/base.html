<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Author Tools{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="28" height="28">
      <span>Author Tools</span>
    </a>
    <div class="status-badge" data-url="{{ url_for('queue_counts') }}">
      <a href="{{ url_for('status_page') }}" title="How busy the converter is">
        <span class="dot {{ site_status.level }}" aria-hidden="true"></span>
        <span class="status-text" aria-live="polite">{{ site_status.short }}</span>
      </a>
      <button type="button" class="refresh" hidden aria-label="Check again" title="Check again">↻</button>
    </div>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer class="site">
    Free tools for writing books in Obsidian. Uploads are deleted after conversion.
    <br><a href="https://hyrumjones.com">by hyrumjones.com</a> · <a href="{{ url_for('status_page') }}">Converter status</a>
  </footer>
  <script src="{{ url_for('static', filename='status.js') }}"></script>
</body>
</html>
