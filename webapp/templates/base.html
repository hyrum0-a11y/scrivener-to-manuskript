<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Author Tools{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ url_for('home') }}">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="28" height="28">
      <span>Author Tools</span>
    </a>
    <a class="byline" href="https://hyrumjones.com">by hyrumjones.com</a>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer class="site">
    Free tools for writing books in Obsidian. Uploads are deleted after conversion.
    <br><a href="https://hyrumjones.com">hyrumjones.com</a>
  </footer>
</body>
</html>
