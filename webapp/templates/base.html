<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Author Tools{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ url_for('home') }}">Author Tools</a>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer class="site">
    Free tools for writing books in Obsidian.
    Uploads are deleted after conversion.
  </footer>
</body>
</html>
