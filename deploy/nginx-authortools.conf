# /etc/nginx/sites-available/authortools  (then: certbot --nginx -d authortools.hyrumjones.com)
server {
    listen 80;
    listen [::]:80;
    server_name authortools.hyrumjones.com;

    client_max_body_size 50m;   # keep in step with AUTHORTOOLS_MAX_UPLOAD_MB

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
